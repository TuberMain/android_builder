name: android_project_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.x 需要 17；若要构建老项目改回 '8' 或 '11'
          java-version: '17'

      - id: get-project
        name: Get project name
        run: echo "PROJECT=$(cat project-to-build)" >> "$GITHUB_OUTPUT"

      - name: Clone project
        run: git clone --depth=1 ${{ steps.get-project.outputs.PROJECT }} project

      - name: Build the app
        working-directory: ./project
        run: |
          # 项目若自带 gradlew 就沿用它自己的 Gradle 版本;
          # 否则用 runner 的 gradle 生成 wrapper, 但显式钉到与 AGP 8 兼容的 8.5
          # (runner 预装的是 Gradle 9.x, 直接 gradle wrapper 会生成不兼容的 9.x)
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: z5q-debug-apk
          path: project/**/*.apk
          if-no-files-found: error
