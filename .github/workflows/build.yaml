name: android_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.x 需要 17；若要构建老项目改回 '8' 或 '11'
          java-version: '17'

      - id: get-project
        name: Get project name
        run: echo "PROJECT=$(cat project-to-build)" >> "$GITHUB_OUTPUT"

      - name: Clone project
        run: git clone --depth=1 ${{ steps.get-project.outputs.PROJECT }} project

      # 关键: runner 预装的是 Gradle 9.x, 直接用它跑 AGP 8.1 会在配置阶段就崩
      # (DependencyHandler.module 在 Gradle 9 已移除)。这里把 Gradle 钉到与 AGP 8 兼容的 8.5。
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-read-only: true

      - name: Build the app
        working-directory: ./project
        run: |
          # 有 gradlew 就用项目自带 wrapper; 没有则直接用已安装的 Gradle 8.5 构建
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: z5q-debug-apk
          path: project/**/*.apk
          if-no-files-found: error
